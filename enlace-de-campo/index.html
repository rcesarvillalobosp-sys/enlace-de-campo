<title>Enlace de Campo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Diseño: riel lateral + página de una columna en escritorio; barra de pestañas inferior en teléfono.
   Gris azulado de planta externa, acento naranja de balizaje de torres, tipografía de señalética. */
:root{
  --bg:#EDF0F4;--surface:#FFFFFF;--surface-2:#E4E9EF;--ink:#13202C;--ink-2:#465463;--line:#CBD3DC;
  --accent:#B93C0B;--accent-ink:#FFFFFF;--accent-soft:#FDE8DC;
  --ok:#17673F;--ok-soft:#DCF2E5;--warn:#8A5A00;--warn-soft:#FBEDC3;--bad:#B0201A;--bad-soft:#FCE3E0;--on-bad:#FFFFFF;
  --focus:#1D5FA8;
  --font-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --radius:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1620;--surface:#15212D;--surface-2:#1C2B3A;--ink:#E6ECF2;--ink-2:#9FB0C0;--line:#2B3C4D;
  --accent:#FF8A50;--accent-ink:#1B0E05;--accent-soft:#3A2113;
  --ok:#5BD08F;--ok-soft:#12301F;--warn:#F2C14E;--warn-soft:#3A2E0E;--bad:#FF8277;--bad-soft:#3B1613;--on-bad:#2A0B08;
  --focus:#6FB0F2;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1620;--surface:#15212D;--surface-2:#1C2B3A;--ink:#E6ECF2;--ink-2:#9FB0C0;--line:#2B3C4D;
  --accent:#FF8A50;--accent-ink:#1B0E05;--accent-soft:#3A2113;
  --ok:#5BD08F;--ok-soft:#12301F;--warn:#F2C14E;--warn-soft:#3A2E0E;--bad:#FF8277;--bad-soft:#3B1613;--on-bad:#2A0B08;
  --focus:#6FB0F2;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font-body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:600;text-wrap:balance}
p{margin:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:32px;max-width:1240px;margin:0 auto;padding-block:20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rail{position:sticky;top:20px;align-self:start;display:flex;flex-direction:column;gap:22px}
.brand h1{font-size:28px;line-height:1;letter-spacing:.01em}
.brand small{display:block;margin-top:5px;color:var(--ink-2);font-size:12px;letter-spacing:.09em;text-transform:uppercase}
.fibra{display:flex;height:6px;margin-top:10px;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.fibra i{flex:1}
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{width:44px;height:44px;flex:none}
.logo b{display:block;font:700 30px/1 var(--font-display);letter-spacing:.06em}
.logo span{display:block;margin-top:4px;font:600 11.5px/1 var(--font-body);letter-spacing:.34em;color:var(--ink-2)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border:0;border-radius:var(--radius);background:none;color:var(--ink-2);font-weight:500;text-align:left;cursor:pointer}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.on{background:var(--ink);color:var(--surface)}
.who{font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.main-col{min-width:0}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;margin-bottom:20px}
.brandm{display:none}
.brandm h1{font-size:24px;line-height:1}
.tools{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.zsel{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--warn)}
.sync.on i{background:var(--ok)} .sync.off i{background:var(--bad)}

input:not([type=checkbox]):not([type=file]),select,textarea{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
textarea{resize:vertical;line-height:1.4}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--accent);border-radius:var(--radius);background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:0 9px;border-radius:12px;background:var(--surface-2);color:var(--ink-2);font-size:12.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.acc{background:var(--accent-soft);color:var(--accent)}

.vh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 20px;margin-bottom:18px}
.vh h2{font-size:38px;line-height:1}
.sub{color:var(--ink-2);margin-top:6px;max-width:62ch}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:28px 0 10px}
.sec h3{font-size:23px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:8px}
.strip>div{background:var(--surface);padding:12px 16px}
.k{font:600 36px/1 var(--font-display);font-variant-numeric:tabular-nums}
.kl{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-top:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{min-height:44px;padding:0 14px;border:0;border-bottom:3px solid transparent;background:none;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.bar>*{flex:1 1 170px;min-width:0}
.bar>.btn{flex:0 0 auto}

.rows{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row.sev-bad::before,.row.sev-warn::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--bad)}
.row.sev-warn::before{background:var(--warn)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .m{display:flex;flex-wrap:wrap;gap:2px 14px;color:var(--ink-2);font-size:13.5px}
.row .side{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.row.click{cursor:pointer}.row.click:hover{background:var(--surface-2)}
.qty{font:600 28px/1 var(--font-display);font-variant-numeric:tabular-nums;text-align:right;min-width:3ch}
.qty small{font:500 13px var(--font-body);color:var(--ink-2);margin-left:3px}
@media (max-width:560px){.row{flex-wrap:wrap}.row .side{width:100%;justify-content:flex-start}}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:var(--radius);background:var(--surface)}
.empty h3{font-size:22px;color:var(--ink);margin-bottom:6px}
.note{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid var(--warn);background:var(--warn-soft);border-radius:var(--radius);margin-bottom:18px}

.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.fld small{color:var(--ink-2);font-size:13px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px}
.scrim{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,14,22,.6)}
.scrim[hidden],.toast[hidden]{display:none}
.sheet{width:min(680px,100%);max-height:92dvh;overflow:auto;background:var(--surface);border-radius:12px 12px 0 0;display:flex;flex-direction:column;gap:14px;
  padding:20px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:10px;padding:24px}}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh h3{font-size:28px;line-height:1.05}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px}
.kv dt{color:var(--ink-2)}.kv dd{margin:0;overflow-wrap:anywhere}

.it{display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.it.no{border-color:var(--bad)}.it.good{border-color:var(--ok)}
.it .q{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 1px var(--ink-2);flex:none}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yn button{min-height:52px;border:2px solid var(--line);border-radius:var(--radius);background:var(--surface);font-weight:600;cursor:pointer}
.yn button.on.y{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.yn button.on.n{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.med{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.med input{max-width:170px;font:500 22px var(--font-mono)}
.prog{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs div{position:relative}
.thumbs img{display:block;width:84px;height:84px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.thumbs button{position:absolute;top:2px;right:2px;width:26px;height:26px;border:0;border-radius:50%;background:var(--ink);color:var(--surface);cursor:pointer;display:grid;place-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.turnos{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.tu{display:flex;flex-direction:column;align-items:center;padding:6px 0;border-radius:4px;background:var(--surface-2);font-size:12px;color:var(--ink-2)}
.tu b{font:600 19px var(--font-display);color:var(--ink)}
.tu.L{opacity:.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;max-width:min(92vw,520px);padding:12px 16px;border-radius:var(--radius);background:var(--ink);color:var(--bg);font-weight:500}
.toast.bad{background:var(--bad);color:var(--on-bad)}

.tabbar{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0;padding-bottom:96px}
  .rail{display:none}
  .brandm{display:block}
  .vh h2{font-size:32px}
  .tabbar{position:fixed;inset:auto 0 0 0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);
    padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar .nav-item{flex-direction:column;justify-content:center;gap:2px;min-height:56px;padding:0;font-size:11.5px;text-align:center}
  .tabbar .nav-item[data-v=auditoria]{display:none}
}
</style>

<div id="app" class="shell"><div class="empty" style="grid-column:1/-1"><h3>Cargando Enlace de Campo</h3>Conectando con la base de datos…</div></div>
<div id="modal" class="scrim" hidden></div>

<script>
(() => {
'use strict';
/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hoy = () => isoDate(new Date());
const diasHasta = f => Math.round((new Date(f + 'T00:00:00') - new Date(hoy() + 'T00:00:00')) / 864e5);
const fFecha = f => f ? new Intl.DateTimeFormat('es-PE', { day: '2-digit', month: 'short', year: 'numeric' }).format(new Date(f + 'T00:00:00')) : '—';
const fHora = t => t ? new Intl.DateTimeFormat('es-PE', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }).format(new Date(t)) : '—';
const num = (n, d = 0) => new Intl.NumberFormat('es-PE', { maximumFractionDigits: d }).format(n ?? 0);
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const ic = (n, c = '') => `<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const opts = (arr, sel, vacio) => (vacio ? `<option value="">${esc(vacio)}</option>` : '') +
  arr.map(o => { const [v, t] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}"${v === sel ? ' selected' : ''}>${esc(t)}</option>`; }).join('');
const val = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
const chk = id => { const e = document.getElementById(id); return !!(e && e.checked); };

/* ---------- constantes del rubro ---------- */
const NAV = [['panel', 'Panel', 'grid'], ['checklists', 'Checklists', 'check'], ['manuales', 'Manuales', 'book'], ['inventario', 'Inventario', 'box'], ['personal', 'Personal', 'users'], ['auditoria', 'Registro', 'clock']];
const CAT_MANUAL = ['Instalación', 'Mantenimiento', 'Fibra óptica', 'Radioenlaces', 'Torres', 'Seguridad', 'Emergencias'];
const CAT_INV = ['Fibra y cable', 'Equipos activos', 'Antenas y radio', 'Energía', 'Conectividad', 'Instrumentos y herramientas', 'EPP y seguridad'];
const EST_INV = ['nuevo', 'en uso', 'en reparación', 'baja'];
const TIPOS_CL = ['Instalación', 'Mantenimiento preventivo', 'Inspección de torre', 'Revisión de sitio', 'Cierre de incidencia'];
const FIBRA = [['Azul', '#1f5fbf'], ['Naranja', '#f08a1c'], ['Verde', '#2e9a4a'], ['Marrón', '#7a4a25'], ['Pizarra', '#6b7785'], ['Blanco', '#ffffff'],
  ['Rojo', '#d32f2f'], ['Negro', '#111111'], ['Amarillo', '#f2d21b'], ['Violeta', '#7b3fa0'], ['Rosa', '#ef7fa8'], ['Celeste', '#2bb5d8']];
const TURNOS = { M: 'Mañana', T: 'Tarde', N: 'Noche', L: 'Libre' };
const DIAS = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
const VIEWS = NAV.map(n => n[0]);

/* ---------- estado ---------- */
const S = {
  view: 'panel', zona: '', f: {}, run: null, booted: false, synced: false, slow: false, err: '',
  d: { zonas: [], personal: [], manuales: [], plantillas: [], asignaciones: [], ejecuciones: [], inventario: [], movimientos: [], lecturas: [], auditoria: [] },
  me: { id: null, name: '' }, names: {},
  caps: { db: false, write: null, admin: false, owner: false, upload: false, save: false }
};
let DB = null, USER = null, ASSETS = null, DL = null;
const puede = () => S.caps.write !== false;
const esAdmin = () => S.caps.admin || S.caps.owner;
const rol = () => S.caps.owner ? 'Administrador' : S.caps.admin ? 'Supervisor' : S.caps.write === false ? 'Solo lectura' : 'Técnico';
const zonaNombre = id => (S.d.zonas.find(z => z.id === id) || {}).nombre || '—';
const enZona = o => !S.zona || o.zonaId === S.zona;

/* nombres de usuarios: se guardan solo ids y se resuelven al mostrar */
const pend = new Set();
const nombreDe = id => !id ? '—' : id === S.me.id ? (S.me.name || 'Tú') : (S.names[id] || 'Alguien');
function quiero(ids) {
  if (!USER) return;
  const falta = [...new Set(ids)].filter(i => i && S.names[i] === undefined && !pend.has(i));
  if (!falta.length) return;
  falta.forEach(i => pend.add(i));
  USER.profiles(falta).then(ps => { falta.forEach(i => { S.names[i] = (ps[i] && ps[i].name) || ''; pend.delete(i); }); sched(); });
}

/* ---------- escritura con registro de auditoría ---------- */
const col = n => DB.collection(n);
function log(accion, detalle, c, ref) {
  col('auditoria').add({ ts: Date.now(), uid: S.me.id, accion, detalle: detalle || '', col: c || '', ref: ref || '' }).catch(() => {});
}
async function guardar(c, id, data, accion, detalle) {
  const r = id ? col(c).doc(id) : col(c).doc();
  await r.set(data); log(accion, detalle, c, r.id); return r.id;
}
async function parchar(c, id, patch, accion, detalle) { await col(c).doc(id).update(patch); log(accion, detalle, c, id); }
async function borrar(c, id, accion, detalle) { await col(c).doc(id).delete(); log(accion, detalle, c, id); }
const errMsg = e => e && e.code === 'invalid_argument' ? 'Tu nivel de acceso no permite este cambio.'
  : e && e.code === 'quota_exceeded' ? 'Se llenó la base de datos. Borra registros antiguos.' : 'No se pudo guardar. Revisa tu conexión e intenta de nuevo.';

/* ---------- descarga de archivos ---------- */
const csvCelda = v => { const s = String(v ?? ''); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };

const sched = () => { if (S.view === 'ejecutar') return; cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); };

const fibraStrip = () => `<div class="fibra" title="Código de colores de fibra">${FIBRA.map(f => `<i style="background:${f[1]}"></i>`).join('')}</div>`;

const cab = (t, sub, acts) => `<header class="vh"><div><h2>${esc(t)}</h2>${sub ? `<p class="sub">${sub}</p>` : ''}</div><div class="acts">${acts || ''}</div></header>`;

async function resolver(ids) {
  if (!USER) return;
  const falta = [...new Set(ids)].filter(i => i && S.names[i] === undefined);
  if (!falta.length) return;
  try { const ps = await USER.profiles(falta); falta.forEach(i => { S.names[i] = (ps[i] && ps[i].name) || ''; }); } catch (_) {}
}
const TIPOS = { pdf: 'application/pdf', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', webp: 'image/webp', gif: 'image/gif', mp4: 'video/mp4', webm: 'video/webm', txt: 'text/plain', md: 'text/markdown', csv: 'text/csv' };
const tipoArchivo = f => TIPOS[(f.name.split('.').pop() || '').toLowerCase()] || null;
async function subir(file, tipo) {
  if (!ASSETS) { toast('Esta vista no permite subir archivos.', 'bad'); return null; }
  const t = tipo || tipoArchivo(file);
  if (!t) { toast('Formato no admitido. Usa PDF, imagen, MP4/WebM o texto. Un Word se guarda antes como PDF.', 'bad'); return null; }
  try { return await ASSETS.upload(file, { type: t }); }
  catch (e) { toast(e && e.code === 'too_large' ? 'El archivo supera los 20 MB.' : e && e.code === 'quota_or_state' ? 'Se llenó el espacio de archivos.' : 'No se pudo subir el archivo.', 'bad'); return null; }
}

/* ---------- consultas compartidas ---------- */

  const o = [];

/* ---------- panel ---------- */

  cs.filter(x => x.d >= 0).forEach(x => fl.push({ s: 'warn', t: `Certificación por vencer: ${x.c.nombre}`, m: `${x.p.nombre} · en ${x.d} días (${fFecha(x.c.vence)})`, a: 'ir', v: 'personal', b: 'Ver personal' }));
  bajos.filter(i => i.cantidad > 0).forEach(i => fl.push({ s: 'warn', t: `Stock bajo: ${i.nombre}`, m: `${zonaNombre(i.zonaId)} · quedan ${num(i.cantidad)} de mínimo ${num(i.minimo)}`, a: 'mover', id: i.id, b: 'Registrar entrada' }));
  sl.forEach(m => fl.push({ s: 'warn', t: `Manual obligatorio sin leer: ${m.titulo}`, m: `Versión ${m.version}`, a: 'verManual', id: m.id, b: 'Abrir' }));
  rev.forEach(e => fl.push({ s: 'warn', t: `Checklist con observaciones: ${e.plantillaNombre}`, m: `${e.sitio || zonaNombre(e.zonaId)} · ${fHora(e.ts)}`, a: 'verRun', id: e.id, b: 'Revisar' }));
  const lista = fl.slice(0, 14);

  const zonas = S.d.zonas.slice().sort((a, b) => (a.orden || 0) - (b.orden || 0));
  const filasZ = zonas.map(z => {
    const ps = S.d.personal.filter(p => p.zonaId === z.id).length, inv = S.d.inventario.filter(i => i.zonaId === z.id);
    const bj = inv.filter(i => i.minimo > 0 && i.cantidad <= i.minimo && i.estado !== 'baja').length, tr = S.d.ejecuciones.filter(e => e.zonaId === z.id && delMes(e)).length;
    return `<div class="row click" data-a="setZona" data-id="${z.id}"><div class="main"><div class="t">${esc(z.nombre)}</div><div class="m"><span>${ps} en personal</span><span>${inv.length} ítems</span><span>${tr} checklists este mes</span></div></div>

  const act = S.d.auditoria.slice(0, 8).map(a => `<div class="row"><div class="main"><div class="t">${esc(a.accion)}</div><div class="m"><span>${esc(a.detalle)}</span></div></div><div class="side"><span class="m">${esc(nombreDe(a.uid))} · ${fHora(a.ts)}</span></div></div>`).join('');
  const hayEj = Object.values(S.d).some(arr => arr.some(x => x.ejemplo));
  return cab('Panel', S.zona ? `Zona: ${esc(zonaNombre(S.zona))}` : 'Todas las zonas', btn('ir', 'Nuevo checklist', 'plus', '', 'data-v="checklists"')) +
    (hayEj ? `<div class="note"><span>Estás viendo datos de ejemplo. Bórralos cuando cargues los reales.</span>${esAdmin() ? btn('borrarEj', 'Borrar datos de ejemplo', '', 'ghost sm') : ''}</div>` : '') +
    `<div class="strip"><div><div class="k">${pend.length}</div><div class="kl">Checklists pendientes</div></div><div><div class="k" style="color:${venc.length ? 'var(--bad)' : 'inherit'}">${venc.length}</div><div class="kl">Vencidos</div></div>
      <div><div class="k">${bajos.length}</div><div class="kl">Con stock bajo</div></div><div><div class="k">${cs.length}</div><div class="kl">Certificaciones por vencer</div></div>${S.me.id ? `<div><div class="k">${sl.length}</div><div class="kl">Manuales sin leer</div></div>` : ''}</div>
    <div class="sec"><h3>Atención ahora</h3></div>` +
    (lista.length ? `<div class="rows">${lista.map(x => `<div class="row sev-${x.s}"><div class="main"><div class="t">${esc(x.t)}</div><div class="m"><span>${esc(x.m)}</span></div></div><div class="side"><button class="btn ghost sm" data-a="${x.a}" ${x.id ? `data-id="${x.id}"` : ''} ${x.v ? `data-v="${x.v}"` : ''}>${esc(x.b)}</button></div></div>`).join('')}</div>${fl.length > 14 ? `<p class="sub">y ${fl.length - 14} avisos más</p>` : ''}` : vacio('Todo en orden', 'No hay checklists vencidos, certificaciones por vencer ni stock bajo.')) +

    <div class="side">${m.obligatorio ? `<span class="chip acc">Obligatorio</span>${S.me.id ? (leido(m) ? '<span class="chip ok">Leído</span>' : '<span class="chip warn">Sin leer</span>') : ''}` : ''}

};
A.leer = d => { const m = S.d.manuales.find(x => x.id === d.id); if (!m) return;

A.guardarManual = async d => {
  const prev = S.d.manuales.find(m => m.id === d.id), titulo = val('mTit');
  if (!titulo) return toast('Escribe el título del manual.', 'bad');
  const f = $('#mFile').files[0]; let asset = prev ? prev.asset || null : null;
  if (f) { const r = await subir(f); if (!r) return; asset = { id: r.id, nombre: f.name, tipo: r.contentType, tam: r.sizeBytes }; }
  const version = val('mVer') || '1.0', hist = prev && prev.historial ? prev.historial.slice() : [];
  if (prev && prev.version !== version) hist.unshift({ version: prev.version, fecha: prev.fecha, asset: prev.asset || null });
  const data = { titulo, categoria: val('mCat'), version, fecha: val('mFec') || hoy(), obligatorio: chk('mObl'), notas: val('mNot'), asset, historial: hist.slice(0, 20) };
  if (prev && prev.ejemplo) data.ejemplo = true;
  await hacer(async () => { await guardar('manuales', d.id || '', data, prev ? 'Actualizó manual' : 'Subió manual', `${titulo} v${version}`); cerrar(); }, 'Manual guardado.');
};

/* ---------- checklists ---------- */
const I = {}, C = {};
const respondido = (i, x) => !!x && (i.unidad ? x.valor != null : x.ok === true || x.ok === false);
const enFuera = (i, v) => v != null && ((i.min != null && v < i.min) || (i.max != null && v > i.max));
const malo = (i, x) => !!x && (x.ok === false || (!!i.unidad && enFuera(i, x.valor)));
const rangoTxt = i => i.min != null && i.max != null ? `${num(i.min, 2)} a ${num(i.max, 2)}` : i.min != null ? `mínimo ${num(i.min, 2)}` : i.max != null ? `máximo ${num(i.max, 2)}` : '';
const chipEstado = e => e.revision && e.revision.estado === 'aprobado' ? '<span class="chip ok">Aprobado</span>'
  : ({ completo: '<span class="chip ok">Completo</span>', observaciones: '<span class="chip warn">Con observaciones</span>', rechazado: '<span class="chip bad">Rechazado</span>', borrador: '<span class="chip">Borrador</span>' }[e.estado] || '');

function itemsToText(items) {
  return (items || []).map(i => (i.critico ? '! ' : '') + i.texto + (i.unidad ? ` = ${i.unidad}` + (i.min != null || i.max != null ? ` [${i.min ?? ''}..${i.max ?? ''}]` : '') : '') +
    (i.manualId ? ' @' + ((S.d.manuales.find(m => m.id === i.manualId) || {}).titulo || '') : '')).join('\n');
}
function textToItems(t) {
  return t.split('\n').map(l => l.trim()).filter(Boolean).map((l, n) => {
    let critico = false, manualId = null;
    if (l[0] === '!') { critico = true; l = l.slice(1).trim(); }
    const at = l.lastIndexOf(' @');
    if (at > -1) { const q = norm(l.slice(at + 2)), m = q && S.d.manuales.find(m => norm(m.titulo).includes(q)); if (m) manualId = m.id; l = l.slice(0, at).trim(); }
    const it = { id: 'i' + n, texto: l, critico };
    const r = l.match(/^(.*?)\s*=\s*(\S+)\s*(?:\[\s*(-?[\d.,]*)\s*\.\.\s*(-?[\d.,]*)\s*\])?\s*$/);
    if (r) {
      const p = s => s === '' || s == null ? null : parseFloat(s.replace(',', '.'));
      it.texto = r[1]; it.unidad = r[2];
      if (r[3] !== undefined) { it.min = p(r[3]); it.max = p(r[4]); }
    }
    if (manualId) it.manualId = manualId;
    return it;
  });
}

  }

async function comprimir(file) {
  try {
    const b = await createImageBitmap(file), k = Math.min(1, 1280 / Math.max(b.width, b.height)), cv = document.createElement('canvas');
    cv.width = Math.round(b.width * k); cv.height = Math.round(b.height * k); cv.getContext('2d').drawImage(b, 0, 0, cv.width, cv.height);
    return await new Promise(r => cv.toBlob(r, 'image/jpeg', .8));
  } catch (_) { return null; }
}
C.foto = async t => {
  const f = t.files[0]; if (!f) return; toast('Subiendo foto…');
  const blob = await comprimir(f), r = blob ? await subir(blob, 'image/jpeg') : await subir(f);
  if (r) { const x = respDe(t.dataset.it); x.fotos = [...(x.fotos || []), r.id]; draw(); toast('Foto agregada.'); }
};

  return hacer(async () => { r.id = await guardar('ejecuciones', r.id, data, estado === 'borrador' ? 'Guardó borrador' : 'Completó checklist', `${r.plantillaNombre} · ${r.sitio || zonaNombre(r.zonaId)}`); }, null);
}

A.completar = async () => {
  const r = S.run, falta = [];
  r.items.forEach(i => { const x = r.resp[i.id] || {};
    if (i.critico && !respondido(i, x)) falta.push(`Falta el ítem crítico: ${i.texto}`);
    if (malo(i, x) && !(x.nota || '').trim()) falta.push(`Explica en una nota: ${i.texto}`); });

function informe(e) {
  const filas = e.items.map(i => { const x = (e.resp || {})[i.id] || {};
    const r = i.unidad ? (x.valor != null ? `${x.valor} ${i.unidad}${enFuera(i, x.valor) ? ' (fuera de rango)' : ''}` : 'Sin medir') : x.ok === true ? 'Cumple' : x.ok === false ? 'No cumple' : 'Sin responder';
    return `<tr><td>${esc(i.texto)}${i.critico ? ' <b>(crítico)</b>' : ''}</td><td>${esc(r)}</td><td>${esc(x.nota || '')}</td></tr>`; }).join('');
  return `<!doctype html><html lang="es"><meta charset="utf-8"><title>Informe de checklist</title><style>body{font:15px/1.4 system-ui,sans-serif;margin:32px;color:#111}table{border-collapse:collapse;width:100%}td,th{border:1px solid #bbb;padding:6px 8px;text-align:left;vertical-align:top}h1{margin:0 0 4px}</style>
<h1>${esc(e.plantillaNombre)}</h1><p>${esc(e.sitio || zonaNombre(e.zonaId))} · ${fHora(e.ts)} · Firma: ${esc(e.firma)} · Estado: ${esc(e.estado)}</p>
<table><tr><th>Ítem</th><th>Resultado</th><th>Nota</th></tr>${filas}</table>${e.nota ? `<p><b>Observaciones:</b> ${esc(e.nota)}</p>` : ''}${e.revision ? `<p><b>Revisión del supervisor:</b> ${esc(e.revision.estado)}. ${esc(e.revision.nota || '')}</p>` : ''}</html>`;
}
A.verRun = async d => {
  const e = S.d.ejecuciones.find(x => x.id === d.id); if (!e) return;

    <div class="g2"><label class="fld"><span>Cargo</span><input id="pCar" type="text" value="${esc(p.cargo || '')}"></label><label class="fld"><span>Zona</span><select id="pZon">${opts(zonasOpts(), p.zonaId || S.zona, 'Sin zona')}</select></label>

    <label class="fld"><span>Certificaciones, una por línea</span><textarea id="pCer" rows="3" placeholder="Trabajo en altura | 2027-03-15">${esc((p.certs || []).map(c => `${c.nombre} | ${c.vence}`).join('\n'))}</textarea></label>
    <label class="fld"><span>Equipos y herramientas, uno por línea</span><textarea id="pEqu" rows="3">${esc((p.equipos || []).join('\n'))}</textarea></label>
    <div class="fld"><span>Turnos (lunes a domingo)</span><div class="turnos">${tu.map((t, n) => `<select id="pTu${n}" aria-label="${DIAS[n]}" style="padding:4px;min-height:40px">${opts(Object.keys(TURNOS), t)}</select>`).join('')}</div></div>
    ${S.me.id ? `<label class="chk"><input id="pUid" type="checkbox" ${p.uid === S.me.id ? 'checked' : ''}>Esta ficha es mía (vincula mi cuenta)</label>` : ''}</div>
    <div class="foot">${p.id ? btn('delPersona', 'Eliminar', '', 'ghost', `data-id="${p.id}"`) : ''}<button class="btn ghost" data-a="cerrar">Cancelar</button>${btn('guardarPersona', 'Guardar ficha', '', '', `data-id="${p.id || ''}"`)}</div>`);
}
A.nuevaPersona = () => formPersona();
A.editarPersona = d => formPersona(S.d.personal.find(p => p.id === d.id));
A.guardarPersona = async d => {
  const prev = S.d.personal.find(p => p.id === d.id), nombre = val('pNomb');
  if (!nombre) return toast('Escribe el nombre de la persona.', 'bad');
  const data = { nombre, cargo: val('pCar'), zonaId: val('pZon'), telefono: val('pTel'), ingreso: val('pIng'), certs: parseCerts(val('pCer')), equipos: val('pEqu').split('\n').map(s => s.trim()).filter(Boolean), turnos: [0, 1, 2, 3, 4, 5, 6].map(n => val('pTu' + n) || 'L'), uid: chk('pUid') ? S.me.id : (prev && prev.uid && prev.uid !== S.me.id ? prev.uid : null) };
  if (prev && prev.ejemplo) data.ejemplo = true;
  await hacer(async () => { await guardar('personal', d.id || '', data, prev ? 'Editó ficha' : 'Creó ficha', nombre); cerrar(); }, 'Ficha guardada.');
};
A.delPersona = d => { const p = S.d.personal.find(x => x.id === d.id); if (p) preguntar('Eliminar ficha', `Se elimina la ficha de ${p.nombre}.`, 'Eliminar', () => hacer(async () => { await borrar('personal', p.id, 'Eliminó ficha', p.nombre); }, 'Ficha eliminada.')); };

/* ---------- registro de actividad ---------- */
function vAuditoria() {
  quiero(S.d.auditoria.map(a => a.uid));
  return cab('Registro de actividad', 'Quién cambió qué y cuándo. Se muestran los últimos 150 movimientos.', esAdmin() ? btn('purgar', 'Borrar registros de más de 90 días', '', 'ghost') : '') +
    (S.d.auditoria.length ? `<div class="rows">${S.d.auditoria.map(a => `<div class="row"><div class="main"><div class="t">${esc(a.accion)}</div><div class="m"><span>${esc(a.detalle)}</span></div></div><div class="side"><span class="m">${esc(nombreDe(a.uid))} · ${fHora(a.ts)}</span></div></div>`).join('')}</div>` : vacio('Sin actividad todavía', 'Cada cambio quedará anotado aquí.'));
}
A.purgar = () => preguntar('Borrar registros antiguos', 'Se eliminan los registros de actividad con más de 90 días.', 'Borrar', () => hacer(async () => {
  const sn = await col('auditoria').where('ts', '<', Date.now() - 90 * 864e5).limit(500).get();
  for (const d of sn.docs) await col('auditoria').doc(d.id).delete();
  toast(`${sn.size} registros borrados.`);
}, null));

/* ---------- eventos y arranque ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const f = A[b.dataset.a]; if (f) f(b.dataset, b);
});
document.addEventListener('input', e => {
  const t = e.target, k = t.dataset && t.dataset.i; if (!k) return;
  if (I[k]) I[k](t, e); else { S.f[k] = t.value; draw(); }
});
document.addEventListener('change', e => { const t = e.target, k = t.dataset && t.dataset.c; if (k && C[k]) C[k](t, e); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) cerrar(); });
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') cerrar(); });

const LIM = { ejecuciones: q => q.orderBy('ts', 'desc').limit(400), movimientos: q => q.orderBy('ts', 'desc').limit(300), auditoria: q => q.orderBy('ts', 'desc').limit(150) };
function suscribir() {
  Object.keys(S.d).forEach(c => {
    let q = col(c); if (LIM[c]) q = LIM[c](q);
    q.onSnapshot(sn => {
      S.d[c] = sn.docs.map(d => ({ id: d.id, ...d.data() }));
      if (!sn.metadata.fromCache) S.synced = true;
      S.err = ''; sched();
    }, er => { S.err = (er && er.code) || 'error'; sched(); });
  });
  setTimeout(() => { if (!S.synced) { S.slow = true; sched(); } }, 10000);
}
async function arrancar() {
  const h = location.hash.slice(1); if (VIEWS.includes(h)) S.view = h;
  draw();
  const c = window.claude;
  if (c && c.use) [DB, USER, ASSETS, DL] = await Promise.all(['db', 'user', 'assets', 'downloads'].map(n => c.use(n).catch(() => null)));
  S.booted = true; S.caps.db = !!DB; S.caps.upload = !!ASSETS; S.caps.save = !!DL;
  if (USER) {
    const me = await USER.me(); S.me = { id: me.id, name: me.name || '' };
    S.caps.owner = await USER.isOwner(); S.caps.admin = await USER.canEdit(); S.caps.write = await USER.can('data.write');
    if (S.caps.owner) S.caps.write = true;
  }
  if (DB) suscribir();
  draw();
}
arrancar();
})();
</script>
